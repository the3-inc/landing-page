name: Deploy production

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to deploy or roll back to (v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node for release verification
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Verify release and deployment configuration
        id: release
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set production variable AWS_REGION}"
          : "${SITE_BUCKET:?Set production variable SITE_BUCKET}"
          : "${DISTRIBUTION_ID:?Set production variable DISTRIBUTION_ID}"
          : "${AWS_ROLE_ARN:?Set production variable AWS_ROLE_ARN}"
          : "${AWS_ACCOUNT_ID:?Set production variable AWS_ACCOUNT_ID}"
          sha=$(node scripts/verify-release.mjs "$RELEASE_TAG")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          cp scripts/site_check.py "$RUNNER_TEMP/site_check.py"
          git checkout --detach "$sha"
      - name: Require successful main CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          success=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&branch=main&event=push&per_page=1" \
            --jq '.workflow_runs[0] | (.status == "completed" and .conclusion == "success")')
          if [ "$success" != true ]; then
            echo "::error::The release commit must have a successful main push CI run. Wait for CI or rerun the failed CI before deploying."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node for the release
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - name: Build with the production measurement ID
        run: |
          [[ "$PUBLIC_GA4_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]] || { echo "::error::Set repository variable PUBLIC_GA4_MEASUREMENT_ID"; exit 1; }
          pnpm build
        env:
          PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: landing-page-${{ github.run_id }}
      - name: Upload assets, then pages
        run: |
          set -euo pipefail
          test -s dist/index.html
          # Keep older hashed assets so cached HTML remains usable during updates.
          if [ -d dist/_astro ]; then
            aws s3 sync dist/_astro/ "s3://$SITE_BUCKET/_astro/" \
              --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          fi
          aws s3 sync dist/ "s3://$SITE_BUCKET/" --exclude '_astro/*' \
            --cache-control 'public,max-age=60' --delete --only-show-errors
      - name: Refresh CloudFront
        id: refresh
        run: |
          set -euo pipefail
          invalidation=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$invalidation"
          echo "invalidation=$invalidation" >> "$GITHUB_OUTPUT"
      - name: Verify public pages
        run: |
          set -euo pipefail
          for path in / /company/ /contact/ /products/ /products/schedula/; do
            status=$(curl --fail --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
              "https://the3.co.jp$path")
            test "$status" = 200
          done
      - name: Verify navigation and static references
        run: python3 "$RUNNER_TEMP/site_check.py" --url https://the3.co.jp
      - name: Record successful release
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          INVALIDATION_ID: ${{ steps.refresh.outputs.invalidation }}
        run: |
          printf 'Deployed %s (%s)\n\nCloudFront invalidation: %s\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" "$INVALIDATION_ID" >> "$GITHUB_STEP_SUMMARY"
          printf '\nVerified company and product pages\n' >> "$GITHUB_STEP_SUMMARY"
