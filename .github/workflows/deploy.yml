name: Deploy production
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '公開または切り戻しする既存リリースタグ'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: the3-inc/landing-page/.github/workflows/deploy-site.yml@main
    with:
      tag: ${{ inputs.tag || github.ref_name }}
