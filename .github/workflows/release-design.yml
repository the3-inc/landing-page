name: Release design package

on:
  push:
    tags: ['design-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '発行する既存のdesign-vMAJOR.MINOR.PATCHタグ'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: design-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Verify design tag and successful main CI
        id: release
        run: |
          set -euo pipefail
          sha=$(python3 scripts/verify_design_release.py "$RELEASE_TAG")
          success=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&per_page=1" --jq '.workflow_runs[0] | (.status == "completed" and .conclusion == "success")')
          test "$success" = true
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git checkout --detach "$sha"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: pnpm build
      - name: Package the verified commit
        run: |
          set -euo pipefail
          python3 scripts/pack_design.py "$RUNNER_TEMP/design"
          python3 -c 'import json, os; from pathlib import Path; p=json.loads((Path(os.environ["RUNNER_TEMP"])/"design/release.json").read_text()); assert p["source_state"] == "committed"; assert p["tag"] == os.environ["RELEASE_TAG"]'
          cd "$RUNNER_TEMP/design"
          sha256sum -c SHA256SUMS
      - name: Publish the package independently of the website
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/design/"* --verify-tag --target "$RELEASE_SHA" --draft --title "$RELEASE_TAG" --notes-file packages/brand/CHANGELOG.md
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
