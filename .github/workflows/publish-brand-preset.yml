name: Publish brand preset

on:
  push:
    tags: ['brand-preset-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing preset tag (brand-preset-v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: brand-preset-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require a main commit with successful CI
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^brand-preset-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse --verify "$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          success=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&per_page=1" \
            --jq '.workflow_runs[0] | (.status == "completed" and .conclusion == "success")')
          test "$success" = true
          git checkout --detach "$sha"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Validate the package version and installer
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('packages/brand-preset/package.json', 'utf8')).version")
          test "$RELEASE_TAG" = "brand-preset-v$version"
          python3 -m unittest discover -s tests -p 'test_brand_preset.py' -v
      - name: Pack and verify the consumer installation
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/brand-preset"
          npm pack ./packages/brand-preset --ignore-scripts --pack-destination "$RUNNER_TEMP/brand-preset"
          cd "$RUNNER_TEMP/brand-preset"
          sha256sum the3-brand-preset-*.tgz > SHA256SUMS
          digest=$(cut -d ' ' -f 1 SHA256SUMS)
          python3 "$GITHUB_WORKSPACE/scripts/install_brand_preset.py" the3-brand-preset-*.tgz \
            --sha256 "$digest" --destination "$RUNNER_TEMP/preset-consumer"
      - name: Publish without replacing an existing release
        run: |
          set -euo pipefail
          printf 'Shared CSS preset for the3 products.\n\nInstall, update and roll back: https://github.com/%s/blob/%s/docs/brand-preset-distribution.md\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" > "$RUNNER_TEMP/brand-preset-notes.md"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/brand-preset/"*.tgz \
            "$RUNNER_TEMP/brand-preset/SHA256SUMS" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest=false --title "the3 brand preset ${RELEASE_TAG#brand-preset-v}" \
            --notes-file "$RUNNER_TEMP/brand-preset-notes.md"
