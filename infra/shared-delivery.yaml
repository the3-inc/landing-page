AWSTemplateFormatVersion: '2010-09-09'
Description: Shared HTTPS delivery and path routing for the3.co.jp

Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing public hosted zone for the3.co.jp in this AWS account
  CompanySiteBucketDomainName:
    Type: String
    Description: SiteBucketDomainName output of the company-site stack
    AllowedPattern: '[a-z0-9.-]+\.s3\.[a-z0-9-]+\.amazonaws\.com'
  GitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Existing GitHub OIDC provider ARN; empty creates one
    AllowedPattern: '^$|arn:aws:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com'

Conditions:
  CreateOidcProvider: !Equals [!Ref GitHubOidcProviderArn, '']

Rules:
  CertificateRegion:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: Deploy this stack in us-east-1 for the CloudFront ACM certificate

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - Key: Project
          Value: shared-delivery
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: the3.co.jp
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: the3.co.jp
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: shared-delivery
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  SiteDns:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: the3.co.jp.
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: the3.co.jp.
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

  DirectoryIndex:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-directory-index'
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve Astro directory pages in the private S3 origin
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!request.uri.split('/').pop().includes('.')) {
            request.uri += '/index.html';
          }
          return request;
        }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: [the3.co.jp]
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: company-site
            DomainName: !Ref CompanySiteBucketDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: company-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndex.FunctionARN
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: Project
          Value: shared-delivery
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation
Outputs:
  DistributionId:
    Value: !Ref Distribution
  GitHubOidcProviderArn:
    Value: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref GitHubOidcProviderArn]
  StaticOriginAccessControlId:
    Value: !GetAtt OriginAccessControl.Id
  DirectoryIndexFunctionArn:
    Value: !GetAtt DirectoryIndex.FunctionARN
  SiteUrl:
    Value: https://the3.co.jp
  CloudFrontUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
